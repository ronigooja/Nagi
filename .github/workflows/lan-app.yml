name: Verify LAN macOS App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: macOS App
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify macOS App
        id: tests
        continue-on-error: true
        run: |
          swift test --package-path macos/NagiApp > "$RUNNER_TEMP/app-tests.log" 2>&1 || { grep -n -E -A 3 -B 2 'error:|failed|XCTAssert|threw error' "$RUNNER_TEMP/app-tests.log" | head -n 180; exit 1; }
      - name: Verify LAN settings tests independently
        id: lan
        continue-on-error: true
        if: always()
        run: |
          swift test --package-path macos/NagiApp --filter 'LANSettings|SettingsTests' > "$RUNNER_TEMP/lan-app-tests.log" 2>&1 || { grep -n -E -A 3 -B 2 'error:|failed|XCTAssert|threw error' "$RUNNER_TEMP/lan-app-tests.log" | head -n 180; exit 1; }
      - name: Package macOS App
        id: package
        continue-on-error: true
        if: always()
        run: |
          make build app > "$RUNNER_TEMP/app-build.log" 2>&1 || { tail -n 100 "$RUNNER_TEMP/app-build.log"; exit 1; }
      - name: Require App checks to pass
        if: always() && (steps.tests.outcome == 'failure' || steps.lan.outcome == 'failure' || steps.package.outcome == 'failure')
        run: exit 1
      - name: Retain failed native diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-native-tests
          path: |
            ${{ runner.temp }}/app-tests.log
            ${{ runner.temp }}/lan-app-tests.log
            ${{ runner.temp }}/app-build.log
          if-no-files-found: ignore
          retention-days: 3

name: build and publish release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish; leave empty for a build without publishing
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-14
    env:
      RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Verify source version
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "$(git status --porcelain)" ]]
          version=$(git describe --tags --always --dirty)
          if [[ -n "$RELEASE_TAG" ]]; then
            case "$RELEASE_TAG" in
              v*) ;;
              *) echo "release must use a v-prefixed tag: $RELEASE_TAG" >&2; exit 1 ;;
            esac
            [[ "$(git describe --tags --exact-match HEAD)" == "$RELEASE_TAG" ]]
            [[ "$version" == "$RELEASE_TAG" ]]
          fi
          printf 'version=%s\ncommit=%s\n' "$version" "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: false

      - name: Locate build caches
        id: cache-paths
        shell: bash
        run: |
          set -euo pipefail
          printf 'go-build=%s\ngo-modules=%s\n' "$(go env GOCACHE)" "$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          swift_version=$({ xcodebuild -version; xcrun swift --version; xcrun --show-sdk-version; } | shasum -a 256 | awk '{print $1}')
          printf 'swift-version=%s\n' "$swift_version" >> "$GITHUB_OUTPUT"

      # Tags can restore default-branch caches, but cannot share each other's
      # tag-scoped entries. Only successful main builds save these snapshots.
      - name: Restore Go build and module caches
        id: go-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.cache-paths.outputs.go-build }}
            ${{ steps.cache-paths.outputs.go-modules }}
          key: nagi-go-v1-${{ runner.os }}-${{ runner.arch }}-1.26.4-${{ hashFiles('go.sum', 'engine.lock') }}-${{ steps.source.outputs.commit }}
          restore-keys: |
            nagi-go-v1-${{ runner.os }}-${{ runner.arch }}-1.26.4-${{ hashFiles('go.sum', 'engine.lock') }}-
            nagi-go-v1-${{ runner.os }}-${{ runner.arch }}-1.26.4-

      - name: Restore Swift build cache
        id: swift-cache
        uses: actions/cache/restore@v4
        with:
          path: macos/NagiApp/.build
          key: nagi-swift-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-paths.outputs.swift-version }}-${{ hashFiles('macos/NagiApp/Package.swift', 'macos/NagiApp/Package.resolved') }}-${{ steps.source.outputs.commit }}
          restore-keys: |
            nagi-swift-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-paths.outputs.swift-version }}-${{ hashFiles('macos/NagiApp/Package.swift', 'macos/NagiApp/Package.resolved') }}-

      - name: Run tests
        env:
          TMPDIR: /private/tmp
          GOFLAGS: -p=1
        run: make test

      - name: Build unsigned macOS App
        run: make build app

      - name: Read pinned engine source
        id: engine
        shell: bash
        run: |
          repository=$(sed -n 's/^repository: https:\/\/github.com\///p' engine.lock)
          repository=${repository%.git}
          commit=$(sed -n 's/^commit: //p' engine.lock)
          [[ "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          printf 'repository=%s\ncommit=%s\n' "$repository" "$commit" >> "$GITHUB_OUTPUT"

      - name: Check out pinned private engine
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.engine.outputs.repository }}
          ref: ${{ steps.engine.outputs.commit }}
          path: .build/mihomo
          fetch-depth: 0
          ssh-key: ${{ secrets.NAGI_MIHOMO_DEPLOY_KEY }}

      - name: Build release archives
        env:
          APPLE_SIGN_IDENTITY: ''
          APPLE_NOTARY_PROFILE: ''
        run: make release

      - name: Verify built assets
        env:
          EXPECTED_VERSION: ${{ steps.source.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for asset in \
            dist/nagi-linux-amd64.tar.gz \
            dist/nagi-linux-arm64.tar.gz \
            dist/nagi-macos-amd64.tar.gz \
            dist/nagi-macos-arm64.tar.gz \
            dist/SHA256SUMS; do
            test -f "$asset"
          done
          (cd dist && shasum -a 256 -c SHA256SUMS)
          case "$(uname -m)" in
            arm64) host_arch=arm64 ;;
            x86_64) host_arch=amd64 ;;
            *) echo 'unsupported release host architecture' >&2; exit 1 ;;
          esac
          "dist/darwin-$host_arch/nagi" --json version > "$RUNNER_TEMP/nagi-version.json"
          python3 - <<'PY'
          import json
          import os
          import plistlib
          import tarfile
          from pathlib import Path

          tag = os.environ["EXPECTED_VERSION"]
          response = json.loads((Path(os.environ["RUNNER_TEMP"]) / "nagi-version.json").read_text())
          if response.get("ok") is not True:
              raise SystemExit("CLI version command did not return a successful response")
          version = response["data"]
          if version.get("nagi") != tag:
              raise SystemExit(f"CLI version does not match {tag}: {version.get('nagi')}")
          commit = next(line.removeprefix("commit: ").strip() for line in Path("engine.lock").read_text().splitlines() if line.startswith("commit: "))
          if version.get("mihomo_commit") != commit:
              raise SystemExit("CLI engine commit does not match engine.lock")
          app_count = 0
          for archive in Path("dist").glob("nagi-macos-*.tar.gz"):
              with tarfile.open(archive, "r:gz") as package:
                  try:
                      metadata = package.extractfile("Nagi.app/Contents/Info.plist")
                  except KeyError:
                      continue
                  info = plistlib.load(metadata)
                  if info.get("CFBundleShortVersionString") != tag.removeprefix("v"):
                      raise SystemExit(f"App version in {archive} does not match {tag}")
                  app_count += 1
          if app_count != 1:
              raise SystemExit(f"Expected one packaged App, found {app_count}")
          print(f"CLI and packaged App versions match {tag}; engine commit matches engine.lock")
          PY

      - name: Save shared Go caches from main
        if: github.ref == 'refs/heads/main' && env.RELEASE_TAG == '' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.cache-paths.outputs.go-build }}
            ${{ steps.cache-paths.outputs.go-modules }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

      - name: Save shared Swift cache from main
        if: github.ref == 'refs/heads/main' && env.RELEASE_TAG == '' && steps.swift-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: macos/NagiApp/.build
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}

      - name: Prepare release notes
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          set -euo pipefail
          previous=$(git tag --list 'v*' --sort=-version:refname | awk -v tag="$RELEASE_TAG" '$0 != tag { print; exit }')
          {
            printf '# Nagi %s\n\n' "$RELEASE_TAG"
            if [[ -n "$previous" ]]; then
              printf 'Changes since [%s]:\n`%s..%s`\n\n' "$previous" "$previous" "$RELEASE_TAG"
              printf '## Changed\n\n'
              git log --format='- %s' "$previous..$RELEASE_TAG"
            else
              printf 'Changes in the first published release.\n\n## Changed\n\n'
              git log --format='- %s' "$RELEASE_TAG"
            fi
            printf '\n## Artifacts\n\n- Linux and macOS archives\n- SHA256SUMS\n'
          } > release-notes.md

      - name: Create GitHub Release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "Nagi $RELEASE_TAG" \
            --notes-file release-notes.md \
            dist/nagi-linux-amd64.tar.gz \
            dist/nagi-linux-arm64.tar.gz \
            dist/nagi-macos-amd64.tar.gz \
            dist/nagi-macos-arm64.tar.gz \
            dist/SHA256SUMS

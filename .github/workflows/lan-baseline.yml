name: Diagnose pre-LAN macOS baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Pre-LAN macOS baseline
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bcf42e39922d5017268b1959ad7ac22d3d86ef8f
      - name: Compare pre-LAN native baseline
        run: |
          swift test --package-path macos/NagiApp > "$RUNNER_TEMP/baseline-app-tests.log" 2>&1 || { grep -n -E -A 2 -B 1 'error:|failed|XCTAssert|threw error' "$RUNNER_TEMP/baseline-app-tests.log" | head -n 180; exit 1; }
